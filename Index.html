
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ON RED | Prototype 0.1</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090a0d;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: absolute;
    top: 22px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: white;
    pointer-events: none;
    z-index: 2;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
}

.status {
    font-size: 11px;
    color: #9296a3;
    margin-top: 5px;
    letter-spacing: 2px;
}

#position {
    color: #ff3434;
    font-size: 12px;
    text-align: right;
    margin-top: 5px;
}

#joystick {
    position: absolute;
    width: 130px;
    height: 130px;
    bottom: 35px;
    left: 28px;
    border: 2px solid #343640;
    border-radius: 50%;
    background: #171920aa;
    z-index: 3;
    touch-action: none;
}

#stick {
    position: absolute;
    width: 52px;
    height: 52px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ff3030;
    box-shadow: 0 0 20px #ff303077;
}

#instruction {
    position: absolute;
    bottom: 48px;
    right: 25px;
    color: #777b88;
    font-size: 10px;
    text-align: right;
    letter-spacing: 1px;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>
        <div class="logo">ON RED</div>
        <div class="status">PROTOTYPE 0.1</div>
    </div>

    <div>
        <div class="status">WORLD POSITION</div>
        <div id="position">0 : 0</div>
    </div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="instruction">
    ARRASTE PARA SE MOVIMENTAR<br>
    WASD / SETAS NO COMPUTADOR
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const positionDisplay = document.getElementById("position");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let width = 0;
let height = 0;
let dpr = 1;

const player = {
    x: 0,
    y: 0,
    radius: 14,
    speed: 260,
    color: "#ff3030"
};

const camera = {
    x: 0,
    y: 0
};

const input = {
    x: 0,
    y: 0
};

const keys = {};

let lastTime = 0;
let joystickPointer = null;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawArena() {
    ctx.fillStyle = "#090a0d";
    ctx.fillRect(0, 0, width, height);

    const gridSize = 50;

    const offsetX = ((-camera.x % gridSize) + gridSize) % gridSize;
    const offsetY = ((-camera.y % gridSize) + gridSize) % gridSize;

    ctx.beginPath();

    for (let x = offsetX; x < width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
    }

    for (let y = offsetY; y < height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
    }

    ctx.strokeStyle = "#1b1e27";
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawPlayer() {
    const screenX = width / 2;
    const screenY = height / 2;

    ctx.beginPath();
    ctx.arc(screenX, screenY, player.radius + 8, 0, Math.PI * 2);
    ctx.fillStyle = "#ff303018";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(screenX, screenY, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.shadowColor = "#ff3030";
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function updateMovement(delta) {
    let moveX = input.x;
    let moveY = input.y;

    if (keys["ArrowLeft"] || keys["a"]) moveX -= 1;
    if (keys["ArrowRight"] || keys["d"]) moveX += 1;
    if (keys["ArrowUp"] || keys["w"]) moveY -= 1;
    if (keys["ArrowDown"] || keys["s"]) moveY += 1;

    const length = Math.hypot(moveX, moveY);

    if (length > 1) {
        moveX /= length;
        moveY /= length;
    }

    player.x += moveX * player.speed * delta;
    player.y += moveY * player.speed * delta;

    camera.x = player.x;
    camera.y = player.y;

    positionDisplay.textContent =
        `${Math.round(player.x)} : ${Math.round(player.y)}`;
}

function gameLoop(timestamp) {
    const delta = lastTime
        ? Math.min((timestamp - lastTime) / 1000, 0.05)
        : 0;

    lastTime = timestamp;

    updateMovement(delta);
    drawArena();
    drawPlayer();

    requestAnimationFrame(gameLoop);
}

// Joystick virtual

function moveJoystick(event) {
    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = event.clientX - centerX;
    let dy = event.clientY - centerY;

    const maxDistance = 39;
    const distance = Math.hypot(dx, dy);

    if (distance > maxDistance) {
        dx = dx / distance * maxDistance;
        dy = dy / distance * maxDistance;
    }

    input.x = dx / maxDistance;
    input.y = dy / maxDistance;

    stick.style.left = `calc(50% + ${dx}px)`;
    stick.style.top = `calc(50% + ${dy}px)`;
}

joystick.addEventListener("pointerdown", (event) => {
    if (joystickPointer !== null) return;

    joystickPointer = event.pointerId;
    joystick.setPointerCapture(event.pointerId);
    moveJoystick(event);
});

joystick.addEventListener("pointermove", (event) => {
    if (event.pointerId !== joystickPointer) return;
    moveJoystick(event);
});

function releaseJoystick(event) {
    if (event.pointerId !== joystickPointer) return;

    joystickPointer = null;
    input.x = 0;
    input.y = 0;

    stick.style.left = "50%";
    stick.style.top = "50%";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

// Teclado

window.addEventListener("keydown", (event) => {
    keys[event.key] = true;
});

window.addEventListener("keyup", (event) => {
    keys[event.key] = false;
});

window.addEventListener("blur", () => {
    Object.keys(keys).forEach(key => keys[key] = false);
});

// Inicialização

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
