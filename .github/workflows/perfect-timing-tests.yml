name: ON RED tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/collisionSystem.js
          node --check js/perfectTimingSystem.js
          node --check js/hexagonSystem.js
          node --check js/pingPong.js
          node --check js/bossSystem.js
          node --check js/mergeSystem.js
          node --check js/audio.js
          node --check js/menu.js
          node --check js/i18n.js
      - name: Run automated tests
        run: node --test tests/*.test.js
