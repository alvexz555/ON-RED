
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#080B12">

    <meta name="description" content="ON RED - Arcade Survival">

    <title>ON RED</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- MENU STYLES -->
    <link rel="stylesheet" href="./css/menu.css">
</head>

<body>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- MAIN MENU -->
    <main id="mainMenu" class="main-menu">

        <div class="menu-content">

            <!-- GAME LOGO -->
            <header class="menu-header">

                <div class="game-logo">
                    ON <span>RED</span>
                </div>

                <p class="game-subtitle">
                    SURVIVE · PERFECT TIMING · MERGE
                </p>

            </header>

            <!-- MENU ACTIONS -->
            <section class="menu-actions">

                <button
                    type="button"
                    id="playButton"
                    class="menu-button play-button"
                >
                    <span>PLAY</span>
                    <span class="button-arrow">›</span>
                </button>

                <!-- BEST SCORE -->
                <div class="score-panel">

                    <span class="score-label">
                        BEST SCORE
                    </span>

                    <span id="bestScore" class="score-value">
                        000000
                    </span>

                </div>

                <!-- SETTINGS BUTTON -->
                <button
                    type="button"
                    id="settingsButton"
                    class="menu-button settings-button"
                >
                    SETTINGS
                </button>

            </section>

            <!-- FOOTER -->
            <footer class="menu-footer">

                <span>ARCADE SURVIVAL</span>
                <span>ON RED · V1.0</span>

            </footer>

        </div>

        <!-- SETTINGS PANEL -->
        <section
            id="settingsPanel"
            class="settings-panel hidden"
        >

            <h2>SETTINGS</h2>

            <p>CONFIGURAÇÕES</p>

            <button
                type="button"
                id="backButton"
                class="menu-button"
            >
                BACK
            </button>

        </section>

    </main>

    <!-- GAME PHYSICS -->
    <script src="./js/obstaclePhysics.js"></script>

    <!-- OBSTACLE AI -->
    <script src="./js/obstacleAI.js"></script>

        <!-- MENU SYSTEM -->
    <script src="./js/menu.js"></script>

    <!-- HEALTH SYSTEM -->
    <script src="./js/healthSystem.js"></script>

    <!-- HEALTH UI -->
    <script src="./js/healthUI.js"></script>

    <!-- MAIN GAME ENGINE -->
    <script src="./js/main.js"></script>



</body>

</html>
