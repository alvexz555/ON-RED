<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ON RED</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <main id="mainMenu" class="main-menu">
        <div class="menu-content">
            <div class="logo">ON <span>RED</span></div>

            <button id="playButton">PLAY</button>
            <button id="settingsButton">SETTINGS</button>

            <div id="settingsPanel" class="settings-panel">
                <button id="backButton">BACK</button>
            </div>

            <div class="menu-footer">
                <span>ARCADE SURVIVAL</span>
            </div>
        </div>
    </main>

    <!-- GAME -->
    <canvas id="gameCanvas"></canvas>

    <!-- GAME OVER -->
    <section
        id="gameOverScreen"
        class="game-over-screen"
        aria-hidden="true"
    >
        <div class="game-over-content">

            <header class="game-over-header">
                <div class="game-over-logo">
                    ON <span>RED</span>
                </div>

                <span class="game-over-label">
                    SURVIVAL TERMINATED
                </span>
            </header>

            <div class="game-over-message">

                <span class="game-over-line"></span>

                <h1 class="melting-title" aria-label="GAME OVER">

                    <span class="melt-letter melt-1" aria-hidden="true">G
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-2" aria-hidden="true">A
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-3" aria-hidden="true">M
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-4" aria-hidden="true">E
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="word-gap" aria-hidden="true"></span>

                    <span class="melt-letter melt-5" aria-hidden="true">O
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-6" aria-hidden="true">V
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-7" aria-hidden="true">E
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                    <span class="melt-letter melt-8" aria-hidden="true">R
                        <i class="drip drip-a"></i>
                        <i class="drip drip-b"></i>
                    </span>

                </h1>

                <p class="game-over-subtitle">
                    YOUR RUN HAS ENDED
                </p>

                <span class="game-over-line"></span>

            </div>

            <div class="game-over-actions">
                <button
                    id="retryButton"
                    class="game-over-button retry-button"
                >
                    RETRY <span>↻</span>
                </button>

                <button
                    id="gameOverMenuButton"
                    class="game-over-button menu-return-button"
                >
                    MAIN MENU
                </button>
            </div>

            <footer class="game-over-footer">
                ON RED · ARCADE SURVIVAL
            </footer>

        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="./js/obstaclePhysics.js"></script>
    <script src="./js/obstacleAI.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/healthSystem.js"></script>
    <script src="./js/healthUI.js"></script>
    <script src="./js/collisionSystem.js"></script>
    <script src="./js/main.js"></script>

</body>
</html>
