
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ON RED</title>

    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #03060d;
        }

        body {
            position: fixed;
            inset: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            touch-action: none;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <script src="./js/obstaclePhysics.js"></script>
    <script src="./js/obstacleAI.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
