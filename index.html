
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#080B12">
    <meta name="description" content="ON RED - Arcade Survival">

    <title>ON RED</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- MENU STYLES -->
    <link rel="stylesheet" href="./css/menu.css">
</head>

<body>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- MAIN MENU -->
    <main id="mainMenu" class="main-menu">

        <div class="menu-content">

            <header class="menu-header">

                <div class="game-logo">
                    ON <span>RED</span>
                </div>

                <p class="game-subtitle">
                    SURVIVE · PERFECT TIMING · MERGE
                </p>

            </header>

            <section class="menu-actions">

                <button
                    type="button"
                    id="playButton"
                    class="menu-button play-button"
                >
                    <span>PLAY</span>
                    <span class="button-arrow">›</span>
                </button>

                <div class="score-panel">

                    <span class="score-label">
                        BEST SCORE
                    </span>

                    <span id="bestScore" class="score-value">
                        000000
                    </span>

                </div>

                <button
                    type="button"
                    id="settingsButton"
                    class="menu-button settings-button"
                >
                    SETTINGS
                </button>

            </section>

            <footer class="menu-footer">

                <span>ARCADE SURVIVAL</span>
                <span>ON RED · V1.0</span>

            </footer>

        </div>

        <!-- SETTINGS PANEL -->
        <section
            id="settingsPanel"
            class="settings-panel hidden"
        >

            <h2>SETTINGS</h2>

            <p>CONFIGURAÇÕES</p>

            <button
                type="button"
                id="backButton"
                class="menu-button"
            >
                BACK
            </button>

        </section>

    </main>

    <!-- GAME OVER SCREEN -->
    <section
    id="gameOverScreen"
    class="game-over-screen"
    aria-hidden="true"
>

        <div class="game-over-content">

            <!-- MELTING PLASTIC TITLE -->
            <svg
                class="melting-title"
                viewBox="0 0 620 190"
                role="img"
                aria-label="GAME OVER"
            >

                <defs>

                    <linearGradient
                        id="moltenPlastic"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >
                        <stop offset="0%" stop-color="#fffafa"/>
                        <stop offset="10%" stop-color="#ffbaba"/>
                        <stop offset="24%" stop-color="#ff5555"/>
                        <stop offset="48%" stop-color="#ed1111"/>
                        <stop offset="75%" stop-color="#b50000"/>
                        <stop offset="100%" stop-color="#590000"/>
                    </linearGradient>

                    <linearGradient
                        id="plasticShine"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >
                        <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
                        <stop offset="35%" stop-color="#ffffff" stop-opacity=".22"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </linearGradient>

                    <filter
                        id="plasticSurface"
                        x="-15%"
                        y="-20%"
                        width="130%"
                        height="150%"
                    >

                        <feTurbulence
                            type="fractalNoise"
                            baseFrequency="0.012 0.025"
                            numOctaves="1"
                            seed="7"
                            result="texture"
                        />

                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="texture"
                            scale="3"
                            xChannelSelector="R"
                            yChannelSelector="G"
                            result="softShape"
                        />

                        <feGaussianBlur
                            in="SourceAlpha"
                            stdDeviation="1.5"
                            result="blurredAlpha"
                        />

                        <feSpecularLighting
                            in="blurredAlpha"
                            surfaceScale="4"
                            specularConstant=".9"
                            specularExponent="18"
                            lighting-color="#ffffff"
                            result="specular"
                        >
                            <fePointLight
                                x="200"
                                y="-100"
                                z="180"
                            />
                        </feSpecularLighting>

                        <feComposite
                            in="specular"
                            in2="SourceAlpha"
                            operator="in"
                            result="plasticHighlight"
                        />

                        <feBlend
                            in="softShape"
                            in2="plasticHighlight"
                            mode="screen"
                        />

                    </filter>

                </defs>

                <g
                    class="plastic-object"
                    filter="url(#plasticSurface)"
                >

                    <!-- MAIN LETTERING -->
                    <text
                        class="plastic-letters"
                        x="310"
                        y="100"
                        text-anchor="middle"
                        fill="url(#moltenPlastic)"
                    >GAME OVER</text>

                    <!-- MELTING PLASTIC -->
                    <g
                        fill="url(#moltenPlastic)"
                        class="plastic-drips"
                    >

                        <path
                            class="drip drip-a"
                            d="M112 88
                               C108 101 112 111 108 125
                               C104 139 114 149 123 141
                               C132 132 123 117 126 104
                               L128 88 Z"
                        />

                        <path
                            class="drip drip-b"
                            d="M215 88
                               C211 101 216 113 212 128
                               C209 140 219 146 228 137
                               C236 128 226 111 230 88 Z"
                        />

                        <path
                            class="drip drip-c"
                            d="M315 88
                               C311 105 316 117 312 137
                               C309 154 322 163 332 150
                               C342 136 328 112 334 88 Z"
                        />

                        <path
                            class="drip drip-d"
                            d="M421 88
                               C418 101 422 112 419 126
                               C416 140 427 147 436 136
                               C444 125 433 108 438 88 Z"
                        />

                        <path
                            class="drip drip-e"
                            d="M510 88
                               C507 101 511 111 508 124
                               C505 137 515 143 524 134
                               C532 124 522 108 527 88 Z"
                        />

                    </g>

                    <!-- SURFACE REFLECTIONS -->
                    <g
                        class="plastic-reflections"
                        fill="none"
                        stroke="url(#plasticShine)"
                        stroke-linecap="round"
                    >

                        <path
                            d="M105 48 Q145 33 185 43"
                            stroke-width="4"
                        />

                        <path
                            d="M240 43 Q280 32 315 40"
                            stroke-width="3"
                        />

                        <path
                            d="M365 43 Q410 32 450 43"
                            stroke-width="4"
                        />

                    </g>

                </g>

            </svg>

            <p>
                YOUR RUN HAS ENDED
            </p>

            <span class="game-over-line"></span>

            <div class="game-over-actions">

                <button
                    type="button"
                    id="retryButton"
                    class="game-over-button retry-button"
                >
                    RETRY
                    <span>↻</span>
                </button>

                <button
                    type="button"
                    id="gameOverMenuButton"
                    class="game-over-button menu-return-button"
                >
                    MAIN MENU
                </button>

            </div>

            <footer class="game-over-footer">
                ON RED · ARCADE SURVIVAL
            </footer>

        </div>

    </section>

    <!-- GAME PHYSICS -->
    <script src="./js/obstaclePhysics.js"></script>

    <!-- OBSTACLE AI -->
    <script src="./js/obstacleAI.js"></script>

    <!-- MENU SYSTEM -->
    <script src="./js/menu.js"></script>

    <!-- HEALTH SYSTEM -->
    <script src="./js/healthSystem.js"></script>

    <!-- HEALTH UI -->
    <script src="./js/healthUI.js"></script>

    <!-- COLLISION SYSTEM -->
    <script src="./js/collisionSystem.js"></script>

    <!-- MAIN GAME ENGINE -->
    <script src="./js/main.js"></script>

</body>
</html>
